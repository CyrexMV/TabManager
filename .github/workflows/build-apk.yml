name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android NDK 29
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Build Release APK (arm64-v8a)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabManager-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_PATH=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          gh release create "$TAG" "$APK_PATH" \
            --title "TabManager $TAG (Galaxy Tab S12 Ultra)" \
            --notes "Nativer High-End-Dateimanager komplett in Rust (eframe + egui + wgpu) für Android arm64-v8a (120 Hz, Dual-Pane, Multi-Tabs, ZIP-Komprimierung & -Entpacken, Papierkorb, Bild-/Text-/ZIP-Viewer, SHA-256-Inspektor)."
